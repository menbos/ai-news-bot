# LLM Configuration - Choose your AI model provider
llm:
  # Provider: 'claude', 'deepseek', 'gemini', 'grok', 'openai'
  # Claude (Anthropic): Excellent quality, higher cost
  # DeepSeek: Good quality, much lower cost, better Chinese support
  # Gemini: Fast, multimodal, free tier available
  # Grok: Advanced reasoning, real-time data
  # OpenAI: Industry standard, latest models
  provider: gemini

  # Optional: Specify a model (if not set, uses provider's default)
  # Claude models: claude-sonnet-4-5-20250929, claude-3-5-sonnet-20241022
  # DeepSeek models: deepseek-chat, deepseek-reasoner
  # model: claude-sonnet-4-5-20250929

news:
  # Maximum news items to fetch per source (fetch more for AI to select from).
  # High-volume feeds (arXiv, Reddit, GitHub Trending) carry their own lower
  # per-feed caps in src/news/fetcher.py and ignore this value.
  max_items_per_source: 10

  # Hard cap on the number of (tier-ordered) international items handed to the
  # Stage-1 selector, to bound prompt size and cost. Feeds are ordered primary
  # first, so trimming drops the low-tier tail. Default: 150
  max_total_items: 150

  # How many hours back to keep fetched items. Larger values catch primary-source
  # announcements (e.g. vendor feature launches) that broke a day or two before
  # the run; the cross-run history (below) prevents the same story repeating
  # day-to-day. Items with no parseable publish date are always kept. Default: 48
  lookback_hours: 48

  # Cross-run "already covered" memory. Tracks stories from previous digests so a
  # continuation isn't re-reported as fresh news. The JSON file is committed back
  # to the repo by the GitHub Actions workflow (the runner itself is ephemeral).
  history:
    enabled: true
    path: data/news_history.json
    retention_days: 7

  # Stage 1: Selection prompt template
  # Placeholders: {total_items}, {formatted_news}
  stage1_prompt_template: |
      {formatted_news}

      ## YOUR TASK - STAGE 1: NEWS SELECTION

      You are a senior AI industry analyst. Analyze the {total_items} news items above and select exactly 15-20 of the highest-quality items.

      ### SELECTION CRITERIA:
      - ✅ Groundbreaking research or technical breakthroughs
      - ✅ Major product launches or significant updates
      - ✅ Important policy changes or regulations
      - ✅ Large funding rounds or M&A activities
      - ✅ Balanced coverage across categories (LLM, Agents, Research, Products, etc.)
      - ✅ Include both international and domestic news when available
      - ✅ Thematic investing intersections: AI in clean energy transition, healthcare/biotech innovation, tech disruption, ESG; and critical materials demand (rare earths, lithium, copper, cobalt) driven by AI infrastructure and energy transition
      - ✅ DEDUPLICATION: If multiple articles cover the same event, product, or company announcement, select ONLY the single best one. "Same story" means the same subject (e.g. multiple outlets covering the same product launch, the same funding round, or the same model release). Do not include the same topic more than once regardless of source or angle.

      ### SOURCE HIERARCHY (each item is tagged with its source tier in parentheses):
      When two items cover the same story, prefer the more authoritative tier in this order:
      1. Primary/Official — company announcements, official docs, status pages
      2. Government/Regulator — White House, NIST, FTC, EU/UK policy bodies
      3. Wire/Business — Reuters, Bloomberg, FT, WSJ, Axios
      4. Tech Media — TechCrunch, The Verge, MIT Tech Review, industry verticals
      5. Research — arXiv, Nature
      6. Community/Dev — Hacker News, GitHub Trending, Reddit
      Use lower tiers (Research, Community) for genuinely new tools, papers, and developer trends, not as a substitute for a primary announcement that exists.

      ### CONTINUATION FILTER:
      - Items marked [COVERED] were already reported in a previous digest. Do NOT select them unless there is a genuinely NEW, material development (e.g. a price, a shipped feature, a regulatory ruling) beyond what was previously reported. Treat a mere follow-up, recap, or reaction as a continuation and skip it.

      ### AVOID (do not select):
      - ❌ Low-quality AI newsletters or aggregators that only copy an announcement without adding information
      - ❌ SEO-generated AI content-farm articles
      - ❌ Unverified rumors or speculation (especially sourced only from social media)
      - ❌ Benchmark screenshots or claims without primary evidence
      - ❌ Reposts that add no new information over a story already selected

      ### OUTPUT FORMAT:
      Return ONLY a JSON array of selected news IDs. No explanations, no markdown, just the JSON array.

      Example format:
      ["INT-1", "INT-5", "DOM-2", "INT-12", ...]

      CRITICAL: Select exactly 15-20 items. No more, no less.

  # Stage 2: Summarization prompt template (complete prompt for creating the digest)
  # Placeholders: {count}, {selected_news}
  # The Python renderer parses the JSON output and enforces category order and deduplication.
  stage2_prompt_template: |
      You are a senior AI industry analyst. Write a 4-6 sentence analytical summary for each of the {count} news items below, and assign each to exactly ONE category.

      {selected_news}

      ## CATEGORIES (use these exact strings — pick the single best fit per item):
      - Thematic Investing
      - Product Launches & Updates
      - Enterprise & Industry Applications
      - Funding & Market Dynamics
      - AI Infrastructure & Hardware
      - Large Language Models & Foundation Models
      - Multimodal AI
      - Robotics & Autonomous Vehicles
      - Policy & Regulation
      - Open Source & Community

      ## CATEGORY GUIDANCE:
      - "Thematic Investing": use for stories tied to investment themes — healthcare/biomedical AI (drug discovery, diagnostics), clean energy transition, ESG, critical materials (rare earths, lithium, copper, cobalt), battery supply chains, commodity supply cycle dynamics, or fund-relevant market dynamics. If the story is primarily a tech announcement, use a tech category instead.
      - Each item must appear in exactly ONE category. Do not repeat any item.

      ## SUMMARY REQUIREMENTS (per item):
      - 4-6 sentences; no shorter, no longer
      - Sentence 1: what happened (core news and context)
      - Sentence 2: technical details, key specs, or metrics
      - Sentence 3: why it matters (industry significance)
      - Sentence 4-6: implications, competitive landscape, future developments
      - Professional analytical tone; include specific numbers and data points
      - Do not invent facts not present in the source

      ## OUTPUT FORMAT:
      Return ONLY a raw JSON array — no markdown, no code fences, no explanation. Each element must have these exact keys:

      [
        {
          "category": "<exact category string from list above>",
          "headline": "<informative headline capturing the key development>",
          "published": "<date from source, e.g. Jun 08, 2025 10:00 UTC, or No date>",
          "summary": "<4-6 sentence analytical summary>",
          "source_name": "<publication name>",
          "source_url": "<full URL>"
        }
      ]

      Summarize ALL {count} items. Output nothing except the JSON array.

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
