name: Daily AI News Digest

on:
  # Triggered externally via cron-job.org at 6:30 AM Zurich time
  # (4:30 AM UTC in summer / 5:30 AM UTC in winter)
  workflow_dispatch:

# Needed to commit the cross-run news history file back to the repo.
permissions:
  contents: write

jobs:
  generate-and-send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and send AI news digest
        env:
          # All values come from GitHub Repository Secrets
          # Configure at: Settings → Secrets and variables → Actions → Repository secrets

          # ============================================
          # LLM Provider Configuration
          # ============================================

          # Choose your provider: claude, deepseek, gemini, grok, or openai
          # Set LLM_PROVIDER secret to your choice (default: claude)
          
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}

          # API Keys (provide the one you're using)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # Optional: Specify a model (if not set, uses provider's default)
          # Examples: claude-sonnet-4-5-20250929, deepseek-chat, deepseek-reasoner
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

          # ============================================
          # Notification Configuration
          # ============================================

          # Required: Notification methods (comma-separated)
          # Examples: email, webhook, email,webhook
          NOTIFICATION_METHODS: ${{ secrets.NOTIFICATION_METHODS }}

          # Email Option A: Gmail (Recommended - easiest setup)
          # Just need your Gmail and an App Password
          # Get App Password at: https://myaccount.google.com/apppasswords
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # Optional: Webhook
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

        # bash + pipefail so the python exit code survives the `tee` pipe.
        shell: bash
        run: |
          set -o pipefail
          # main.py exits non-zero only when NOTHING was sent, so a retry can
          # never duplicate an email. Daily failures are usually a transient LLM
          # response (truncation/empty/parse), so one retry absorbs most of them.
          for attempt in 1 2; do
            echo "=== Run attempt ${attempt}/2 ==="
            if python main.py 2>&1 | tee -a run.log; then
              exit 0
            fi
            echo "::warning::Run attempt ${attempt} failed."
            [[ ${attempt} -lt 2 ]] && { echo "Retrying in 30s..."; sleep 30; }
          done
          echo "::error::All run attempts failed; see the run.log artifact."
          exit 1

      - name: Commit updated news history
        if: always()
        run: |
          if [[ -z "$(git status --porcelain data/news_history.json)" ]]; then
            echo "No changes to news history."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_history.json
          git commit -m "chore: update news history [skip ci]"
          # Retry against a moving remote (e.g. overlapping runs): rebase our
          # single history commit on top of origin/main and push, a few times.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed news history (attempt $attempt)."
              exit 0
            fi
            echo "Push rejected, rebasing on origin/main (attempt $attempt)..."
            git pull --rebase --autostash origin main || true
          done
          echo "::warning::Could not push news history after 3 attempts; skipping."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: error-logs
          path: run.log
          if-no-files-found: warn
          retention-days: 7
